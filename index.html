<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXUSS - Website Resmi Kelas X TJKT 1 | SMK Negeri 1 PBG</title>
  
  <!-- Tailwind CSS CDN & Extensions -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Phosphor Icons Web CDN -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  
  <!-- Supabase Client & Config -->
  <script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="/supabase/supabase_config.js"></script>
  <script src="/supabase/supabase_client.js"></script>
  
  <!-- Unregister Legacy Service Workers -->
  <script>
    if (typeof navigator !== 'undefined' && 'serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (var i = 0; i < registrations.length; i++) {
          registrations[i].unregister();
        }
      }).catch(function() {});
    }
  </script>
  
  <!-- Google Fonts: Plus Jakarta Sans, Playfair Display, JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  
  <!-- Tailwind Theme Configuration -->
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            serif: ['"Playfair Display"', 'serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            brand: {
              50: '#fff7ed',
              100: '#ffedd5',
              200: '#fed7aa',
              300: '#fdba74',
              400: '#fb923c',
              500: '#f97316',
              600: '#ea580c',
              700: '#c2410c',
              800: '#9a3412',
              900: '#7c2d12',
              950: '#431407',
            }
          }
        }
      }
    }
  </script>
  
  <style>
    /* Lightbox photo appear animation */
    @keyframes photoAppear {
      0% {
        opacity: 0;
        transform: scale(0.94);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }
    .animate-photo-appear {
      animation: photoAppear 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    body {
      max-width: 100vw;
      overflow-x: hidden;
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
      -webkit-font-smoothing: antialiased;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: auto;
    }
    img, svg, video {
      max-width: 100%;
      height: auto;
    }
    .break-words-safe {
      overflow-wrap: break-word;
      word-break: break-word;
    }
    @media (max-width: 639px) {
      .mobile-grid-1col {
        grid-template-columns: repeat(1, minmax(0, 1fr)) !important;
      }
    }
    .page-enter {
      animation: pageEnter 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes pageEnter {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .splash-enter {
      animation: splashFadeIn 0.35s ease-out forwards;
    }
    @keyframes splashFadeIn {
      from { opacity: 0; transform: scale(0.98); }
      to { opacity: 1; transform: scale(1); }
    }
    .splash-badge-pulse {
      animation: badgePulse 2s ease-in-out infinite;
    }
    @keyframes badgePulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }
    .pulse-ring {
      animation: pulseRing 2.2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
    }
    @keyframes pulseRing {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.2); opacity: 0.15; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
    .card-hover {
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .card-hover:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 24px -6px rgba(15, 23, 42, 0.08), 0 4px 8px -4px rgba(15, 23, 42, 0.04);
    }
    .glass-panel {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(226, 232, 240, 0.9);
    }
    .glass-panel-dark {
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(51, 65, 85, 0.7);
    }
    .equalizer-bar-1 { animation: eqBar 1.1s ease-in-out infinite alternate; }
    .equalizer-bar-2 { animation: eqBar 0.7s ease-in-out 0.2s infinite alternate; }
    .equalizer-bar-3 { animation: eqBar 0.9s ease-in-out 0.4s infinite alternate; }
    @keyframes eqBar {
      0% { height: 3px; }
      100% { height: 14px; }
    }
    .shimmer-bar {
      background: linear-gradient(90deg, #ea580c 0%, #fbbf24 50%, #ea580c 100%);
      background-size: 200% 100%;
      animation: shimmerMove 2s infinite linear;
    }
    @keyframes shimmerMove {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    .blackboard-chalk {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.5), 0 4px 6px -1px rgba(0,0,0,0.1);
      border: 3px solid #78350f;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen selection:bg-orange-100 selection:text-orange-950">
  <div id="root"></div>

  <!-- Vite Modular Application Entry Point -->
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
